apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicine-reminder-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicine-reminder-frontend
  template:
    metadata:
      labels:
        app: medicine-reminder-frontend
    spec:
      containers:
        - name: frontend
          image: medicine-reminder-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: medicine-reminder-frontend
spec:
  type: NodePort
  selector:
    app: medicine-reminder-frontend
  ports:
    - port: 80
      targetPort: 3000
